# Local dictionary — integrated web deployment (single entry point).
#
#   docker compose -f docker/docker-compose.yml up -d --build
#   open http://localhost:8088
#
# Only the web container publishes a port. It serves the Flutter bundle and
# reverse-proxies /api/ to the backend over the compose network, so the frontend
# and backend share one origin: no CORS, and the backend (which reports absolute
# dictionary paths) is never directly reachable from outside.
#
# The dictionary folder is mounted read-only and scanned recursively for .mdx
# archives; a sibling .mdd of the same basename supplies pronunciation audio.
# Override its location with DICT_PATH:
#   DICT_PATH=/mnt/d/dicts docker compose -f docker/docker-compose.yml up -d --build

name: local-dict

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: local-dict-backend:latest
    container_name: local-dict-backend
    environment:
      DICT_DIR: /dictionaries
      DICT_HOST: 0.0.0.0
      DICT_PORT: "8080"
    volumes:
      - "${DICT_PATH:-../Dictionary.com 20260913_hahaya}:/dictionaries:ro"
    # Intentionally not published: only the web container proxies to it.
    # Uncomment to expose the raw API (e.g. for curl/debugging):
    # ports:
    #   - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # Empty => same-origin API through the nginx proxy above.
        DICT_API_BASE: ""
    image: local-dict-web:latest
    container_name: local-dict-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"
    restart: unless-stopped
