# Local dictionary — web frontend + dictionary backend.
#
# Start:  docker compose -f docker/docker-compose.yml up -d --build
# Open:   http://localhost:8088
# Verify: curl http://localhost:8080/api/health
#
# The dictionary folder is mounted read-only and scanned recursively for .mdx
# archives (a sibling .mdd of the same basename supplies pronunciation audio).
# Override DICT_PATH if your archives live elsewhere:
#   DICT_PATH=/mnt/d/dicts docker compose -f docker/docker-compose.yml up -d --build

name: local-dict

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: local-dict-backend:latest
    container_name: local-dict-backend
    environment:
      DICT_DIR: /dictionaries
      DICT_HOST: 0.0.0.0
      DICT_PORT: "8080"
    volumes:
      - "${DICT_PATH:-../Dictionary.com 20260913_hahaya}:/dictionaries:ro"
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # Baked in as the compile-time default backend address. Can be
        # overridden at runtime with ?api=http://host:port in the URL.
        DICT_API_BASE: "${WEB_API_BASE:-http://localhost:8080}"
    image: local-dict-web:latest
    container_name: local-dict-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"
    restart: unless-stopped
