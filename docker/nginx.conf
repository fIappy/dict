# nginx config for the Flutter web build.
#
# This container is the SINGLE entry point of the web deployment: it serves the
# static bundle and reverse-proxies /api/ to the dictionary backend. Frontend and
# backend therefore share one origin, which removes CORS entirely and keeps the
# backend off the network (it is never published).
#
# NOTE: nginx `types` blocks *replace* (not extend) the inherited MIME map, so
# extra types are declared only inside narrowly-scoped `location` blocks that
# match a single extension. Everything else keeps the stock mime.types.
#
# If you instead host the bundle on a CDN/static host, run the backend with its
# port published and point the frontend at it with ?api=http://host:port — see
# docs/WEB_DEPLOYMENT.md.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Dictionary backend (same origin) ----
    #
    # Resolution is deferred through a variable so nginx still starts when the
    # backend is absent (e.g. frontend-only run) instead of failing at boot.
    # 127.0.0.11 is Docker's embedded DNS resolver.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream backend:8080;
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Pronunciation audio is streamed: ranges must reach the backend
        # untouched and the response must not be buffered to disk.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        audio/mpeg;

    # ---- Flutter's canvaskit loads .wasm and .mjs ----
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.mjs$ {
        types { application/javascript mjs; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Build artifacts are content-hashed: cache them forever ----
    location ~* ^/(canvaskit|assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/(main\.dart\.js|flutter_bootstrap\.js|flutter\.js|manifest\.json)$ {
        add_header Cache-Control "public, max-age=60";
        try_files $uri =404;
    }

    # ---- The shell and service worker must never be cached ----
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
