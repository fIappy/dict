# nginx config for the Flutter web build.
#
# The app is a single-page bundle; unknown paths fall back to index.html.
#
# NOTE: nginx `types` blocks *replace* (not extend) the inherited MIME map, so
# extra types are declared only inside narrowly-scoped `location` blocks that
# match a single extension. Everything else keeps the stock mime.types.
#
# The backend is intentionally NOT proxied here: the app talks to it directly
# and the backend already sends permissive CORS headers. To collapse both onto
# one origin (recommended behind TLS), build the web image with an empty
# DICT_API_BASE and add the proxy block documented in docs/WEB_DEPLOYMENT.md.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        audio/mpeg;

    # ---- Flutter's canvaskit loads .wasm and .mjs ----
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.mjs$ {
        types { application/javascript mjs; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Build artifacts are content-hashed: cache them forever ----
    location ~* ^/(canvaskit|assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/(main\.dart\.js|flutter_bootstrap\.js|flutter\.js|manifest\.json)$ {
        add_header Cache-Control "public, max-age=60";
        try_files $uri =404;
    }

    # ---- The shell and service worker must never be cached ----
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
