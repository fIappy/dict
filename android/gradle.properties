org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental caches cannot relativise paths across drive roots
# (pub cache on C:, this project on D:), which aborts plugin compilation.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# This machine has 32 cores, and Gradle still runs independent tasks serially
# without these. `caching` reuses the release outputs of unchanged tasks between
# builds (the per-ABI APK packaging in particular).
org.gradle.parallel=true
org.gradle.caching=true
